{% extends 'layouts/_layout_auth.html' %}
{% block page_title %}{{ titulo }}{% endblock %}

{% block auth_content %}
<div class="cl-auth__brand">
  <i data-lucide="{{ icono }}" style="width:44px;height:44px;color:var(--cl-brand-text);"></i>
  <h1 class="cl-auth__title">{{ titulo }}</h1>
  <p class="cl-auth__subtitle">{{ mensaje }}</p>
</div>
<a href="{{ url_for('index') }}" class="cl-btn cl-btn--primary" style="width:100%;height:48px;justify-content:center;">
  <i data-lucide="arrow-left" class="icon-sm"></i> Regresar a mi pantalla
</a>
{% endblock %}
