# KaiRest en una VM chica de Google Cloud (e2-micro: 2 vCPU compartidas, 1 GB RAM).
#
# Mismo stack que la instalación local (web + PostgreSQL + Redis + respaldos), más
# Caddy delante para HTTPS automático con el dominio. Diferencias con el compose de
# desarrollo:
#   - el código va dentro de la imagen (no se monta la carpeta)
#   - FLASK_ENV=production (cookies seguras: requiere HTTPS, lo da Caddy)
#   - memoria acotada para que todo quepa en 1 GB (más el swap del startup.sh)
#
# Se usa desde deploy/gcp/:  docker compose up -d --build
# Variables en deploy/gcp/.env (ver .env.example de esta carpeta).

services:
  web:
    build:
      context: ../..
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://casaleones:${POSTGRES_PASSWORD}@db:5432/casaleones
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379
      - CACHE_REDIS_URL=redis://redis:6379/2
      - CORS_ORIGINS=https://${DOMINIO}
      - APP_TIMEZONE=America/Mexico_City
      # Pool chico: Postgres en esta VM tiene max_connections=30
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=5
    volumes:
      - uploads:/app/backend/static/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 420m

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: casaleones
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: casaleones
    command: >
      postgres -c shared_buffers=48MB -c work_mem=2MB -c maintenance_work_mem=16MB
               -c max_connections=30 -c effective_cache_size=128MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casaleones"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 220m

  redis:
    image: redis:alpine
    restart: unless-stopped
    # appendonly: las sesiones sobreviven reinicios y actualizaciones (sin esto, cada
    # `up --build` sacaba a todo el personal y había que volver a meter PIN)
    command: redis-server --maxmemory 24mb --maxmemory-policy allkeys-lru --appendonly yes --save ""
    volumes:
      - redisdata:/data
    mem_limit: 48m

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: casaleones
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: casaleones
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
          pg_dump -Fc > /backups/casaleones_$$TIMESTAMP.dump;
          echo \"[BACKUP] $$TIMESTAMP completado\";
          find /backups -name '*.dump' -mtime +7 -delete;
          sleep 3600;
        done
      "
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 48m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMINIO=${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    mem_limit: 64m

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
